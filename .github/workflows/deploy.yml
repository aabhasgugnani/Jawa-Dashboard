name: Jawa Dashboard Refresh

# Mirror of the dashboard built by yashtayal-a11y/Jawa-Dashboard.
# The original build needs that repo's secrets (JAWA_STATE_KEY, JAWA_SOURCES), which aren't available here,
# so this copies the finished, published dashboard and republishes it on this repo's GitHub Pages.
# Each successful copy is also saved in snapshot/ so the site keeps working if the source ever goes away.
# The original build workflow is in this repo's git history (and in pipeline/).

on:
  schedule:
    # ~11:30 and ~17:30 IST, an hour or so after the source's own 10:00 / 16:00 IST builds.
    - cron: "7 6 * * *"
    - cron: "7 12 * * *"
  workflow_dispatch:

concurrency:
  group: jawa-refresh
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copy the published dashboard
        id: copy
        run: |
          SRC=https://yashtayal-a11y.github.io/Jawa-Dashboard
          FILES="index.html new.html version.json data/jawa_payload.json.gz data/jawa_payload_unique.json.gz data/jawa_daily.json.gz data/jawa_daily_unique.json.gz"
          mkdir -p fresh/data
          ok=true
          for f in $FILES; do
            curl -fsSL --retry 3 -o "fresh/$f" "$SRC/$f?nocache=$(date +%s)" || { echo "::warning::could not fetch $f"; ok=false; }
          done
          if $ok; then
            rm -rf snapshot && mv fresh snapshot
            echo "fresh=true" >> "$GITHUB_OUTPUT"
            echo "Copied the latest build: $(cat snapshot/version.json)"
          else
            echo "fresh=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Source site unavailable - republishing the last saved snapshot"
            [ -f snapshot/index.html ] || { echo "::error::no saved snapshot yet"; exit 1; }
          fi

      - name: Save snapshot and keep repo active
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          echo "Last run: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" > last_run.txt
          git add -A snapshot last_run.txt
          git diff --cached --quiet || git commit -q -m "chore: refresh $(date -u '+%Y-%m-%d %H:%M')"
          git push

      - name: Prepare site
        run: |
          mkdir -p _site
          cp -r snapshot/. _site/
          # point the "Run data refresh" button at this repo's workflow
          sed -i "s#github.com/yashtayal-a11y/Jawa-Dashboard#github.com/${GITHUB_REPOSITORY}#g" _site/index.html _site/new.html
          ls -laR _site | head -20

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
